[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Security headers for every response. The Content-Security-Policy is the
# main XSS / script-injection defence: scripts and styles can only come from
# the site itself (plus the Google Fonts hosts the stylesheet imports), and
# inline JavaScript is banned entirely. Vite dev server does NOT apply these
# headers — they take effect on the Netlify deploy.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://api.baserow.io https://v3.football.api-sports.io; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self' https:; frame-ancestors 'none'"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200